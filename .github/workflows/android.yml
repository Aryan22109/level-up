name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the APK to a GitHub Release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: Generate app icon and splash screen
        run: npx capacitor-assets generate --android

      - name: Add notification sound, small icon and permissions
        run: |
          mkdir -p android/app/src/main/res/raw android/app/src/main/res/drawable
          cp assets/chime.wav android/app/src/main/res/raw/chime.wav
          cp assets/ic_stat_levelup.png android/app/src/main/res/drawable/ic_stat_levelup.png
          python3 scripts/add_permissions.py

      - name: Sync web files into the app
        run: npx cap sync android

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: android

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk level-up.apk

      - name: Upload APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: level-up-apk
          path: level-up.apk

      - name: Attach APK to the GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: level-up.apk
          generate_release_notes: true
